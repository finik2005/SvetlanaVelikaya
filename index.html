<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Тест</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <div class="container">

        <div class="question-box">

            <h1 id="questionText"></h1>

        </div>

        <div class="image-box">

            <img
                id="questionImage"
                src=""
                alt="Вопрос">

        </div>

        <div id="message"></div>

        <div
            id="answers"
            class="answers-grid">

        </div>

    </div>


    <!-- Просмотр изображения -->

    <div
        id="imageModal"
        class="modal">

        <span id="closeImage">

            &times;

        </span>

        <img
            id="modalImage"
            alt="Просмотр">

    </div>


    <script src="script.js"></script>

</body>

</html>
