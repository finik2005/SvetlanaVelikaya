<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Мини-тест</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="container">

        <!-- Вопрос -->

        <section class="question-box">

            <h2 id="questionText"></h2>

        </section>

        <!-- Картинка -->

        <section class="image-box">

            <img
                id="questionImage"
                src=""
                alt="Вопрос">

        </section>

        <!-- Сообщение после ошибки -->

        <section id="message"></section>

        <!-- Варианты ответа -->

        <section
            id="answers"
            class="answers-grid">

        </section>

    </main>

    <!-- Увеличение изображения -->

    <div id="imageModal">

        <span id="closeImage">

            &times;

        </span>

        <img
            id="modalImage"
            src=""
            alt="">

    </div>

    <script src="script.js"></script>

</body>

</html>
